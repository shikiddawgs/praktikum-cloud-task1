<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure & Vercel Test Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0078D4, #00B4FF);
            color: white;
            text-align: center;
            padding-top: 100px;
        }
        .card {
            background: rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }
        h1 { margin-bottom: 10px; }
        p { font-size: 18px; margin: 8px 0; }
        .student-info {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 16px;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #0078D4;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: #f0f0f0; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Azure & Vercel Web Test</h1>
        <p>Website ini berhasil berjalan di Cloud Server!</p>
        
        <!-- Bagian Modifikasi Tambahan Identitas -->
        <div class="student-info">
            <p><strong>Praktikan:</strong> Anggoro Cipta Widodo</p>
            <p><strong>NIM:</strong> 102042400045</p>
        </div>

        <p id="time"></p>
        <button class="btn" onclick="showMessage()">Klik Saya</button>
    </div>

    <script>
        function showMessage() {
            alert("Halo! Continuous Deployment di Vercel berhasil diproses 🎉");
        }

        function updateTime() {
            const now = new Date();
            document.getElementById("time").innerText = "Waktu sekarang: " + now.toLocaleString();
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
